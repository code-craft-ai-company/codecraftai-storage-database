[tool.poetry]
name = "codecraftai-storage-database"
description = "Code Craft AI - Storage Database"
version = "1.0.0"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-errors = { version = "<2.0.0", source = "codecraftai" }
codecraftai-runtime = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-dataprofiles = { version = "<2.0.0", source = "codecraftai" }
sqlalchemy = "^2.0.43"
sqlalchemy-utils = "^0.42.0"
psycopg2-binary = "^2.0.10"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
